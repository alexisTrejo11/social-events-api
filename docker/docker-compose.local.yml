# Local profile: full stack (Postgres, Redis, app, Nginx, Certbot).
# Service hostnames below override .env so containers talk on the Docker network.
# Run from repo root — see docker/README.md

services:
  postgres:
    image: postgres:15-alpine
    container_name: social_events_postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-social_events_db}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social_events_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: social_events_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - social_events_network
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: social_events_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-social_events_db}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      POPULATE_DUMMY_DATA: ${POPULATE_DB:-false}
    expose:
      - "8000"
    volumes:
      - ..:/app
      - logs_volume:/app/logs
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - social_events_network
    restart: unless-stopped
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: social_events_nginx
    depends_on:
      - web
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app-http-only.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - social_events_network
    restart: unless-stopped
    command: "/docker-entrypoint.sh"

  certbot:
    image: certbot/certbot:latest
    container_name: social_events_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs_volume:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  social_events_network:
    driver: bridge
    name: social_events_network
