<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f5f5f5;
        }
        
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
        }
        
        .email-logo {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        
        .email-body {
            padding: 40px 30px;
        }
        
        .greeting {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        
        .content {
            font-size: 16px;
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .content p {
            margin-bottom: 16px;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .info-box {
            background-color: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 25px 0;
            border-radius: 4px;
        }
        
        .info-box-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }
        
        .info-box-content {
            color: #4a5568;
            font-size: 15px;
        }
        
        .email-footer {
            background-color: #f7fafc;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        
        .footer-text {
            font-size: 14px;
            color: #718096;
            margin-bottom: 15px;
        }
        
        .footer-links {
            margin-top: 15px;
        }
        
        .footer-link {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 30px 0;
        }
        
        @media only screen and (max-width: 600px) {
            .email-header {
                padding: 30px 20px;
            }
            
            .email-body {
                padding: 30px 20px;
            }
            
            .greeting {
                font-size: 20px;
            }
            
            .content {
                font-size: 15px;
            }
            
            .btn {
                display: block;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <!-- Header -->
        <div class="email-header">
            <a href="{{ site_url }}" class="email-logo">{{ site_name }}</a>
        </div>
        
        <!-- Body -->
        <div class="email-body">
            {% block content %}
            <!-- Email content goes here -->
            {% endblock %}
        </div>
        
        <!-- Footer -->
        <div class="email-footer">
            <p class="footer-text">
                © {{ current_year }} {{ site_name }}. All rights reserved.
            </p>
            <p class="footer-text">
                Need help? Contact us at <a href="mailto:{{ support_email }}" class="footer-link">{{ support_email }}</a>
            </p>
            <div class="footer-links">
                <a href="{{ site_url }}/about" class="footer-link">About</a>
                <a href="{{ site_url }}/privacy" class="footer-link">Privacy Policy</a>
                <a href="{{ site_url }}/terms" class="footer-link">Terms of Service</a>
            </div>
        </div>
    </div>
</body>
</html>
